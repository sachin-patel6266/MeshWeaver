[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshweaver"
version = "0.1.0"
description = "A zero-central-server asyncio peer-to-peer task broker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cloudpickle>=3.0",
    "cryptography>=42.0",
    "psutil>=5.9",
    "rich>=13.7",
]

[project.scripts]
meshweaver = "meshweaver.cli:main"

[tool.setuptools.packages.find]
include = ["meshweaver*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

